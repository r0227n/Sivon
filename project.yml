name: Sivon
options:
  bundleIdPrefix: app.sivon
  deploymentTarget:
    macOS: "14.0"
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.25.0
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: 1.7.0
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.12.0
  Perception:
    url: https://github.com/pointfreeco/swift-perception
    from: 2.0.0
targets:
  Sivon:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Sivon
    resources:
      - path: Resources
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: CasePaths
        product: CasePaths
      - package: Dependencies
        product: Dependencies
      - package: Perception
        product: Perception
      - package: Perception
        product: PerceptionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sivon.mac
        PRODUCT_NAME: Sivon
        INFOPLIST_KEY_CFBundleDisplayName: Sivon
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  SivonTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SivonTests
    dependencies:
      - target: Sivon
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: CasePaths
        product: CasePaths
      - package: Dependencies
        product: Dependencies
      - package: Perception
        product: Perception
      - package: Perception
        product: PerceptionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sivon.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
